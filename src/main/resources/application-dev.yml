management:
  security:
    enabled: false
  metrics:
    binders:
      hystrix:
        enabled: false

security:
  basic:
    enabled: false

logging:
  level:
    org:
      hibernate:
        sql: DEBUG
        basicbinding:
          log-level: trace

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  main:
    allow-circular-references: true

  application:
    name: template-core

  mvc:
    pathmatch:
      matching-strategy: ant-path-matcher

  jackson:
    serialization:
      write-dates-as-timestamps: true

  liquibase:
    default-schema: dbo
    enabled: false
    change-log: classpath:data/changelog-master.xml

  output:
    ansi:
      enabled: ALWAYS

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=Gestion_Tickets;encrypt=false;trustServerCertificate=true
    username: SA
    password: 123

  jpa:
    database-platform: org.hibernate.dialect.SQLServer2012Dialect
    database: SQL_SERVER
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: none
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        formatsql: true
        sql:
          debug: true
        default_schema: dbo
        id:
          new_generator_mappings: true
        cache:
          use_second_level_cache: false
          use_query_cache: false
          use_minimal_puts: true
          region:
            factory_class: com.hazelcast.hibernate.HazelcastCacheRegionFactory
          hazelcast:
            instance_name: hazelcast
            use_lite_member: true
        generate_statistics: true
      org:
        hibernate:
          envers:
            store_data_at_delete: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: harrabimohamedsaleh71@gmail.com
    password: vyqe cewo rdbe hqfv
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 3000

  config:
    use-legacy-processing: true

lang:
  secondary: ar

server:
  servlet:
    contextPath: /template-core
  port: 9010
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json
    min-response-size: 1024

hystrix:
  command:
    default:
      execution:
        isolation:
          strategy: THREAD

email:
  from: harrabimohamedsaleh71@gmail.com
  to: harrabimohamedsaleh71@gmail.com
