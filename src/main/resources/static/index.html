<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>1–1 Private Chat</title>
  <link rel="stylesheet" href="/template-core/main.css" />
</head>
<body>

  <noscript>
    <h2>Sorry! Your browser doesn't support JavaScript</h2>
  </noscript>

  <div id="login-page" class="username-page-container">
    <h1 class="title">Login to Chat</h1>
    <div class="username-page-container">
        <form id="loginForm" name="loginForm">
            <div class="form-group">
                <input type="text" id="username" placeholder="Username" autocomplete="off" class="form-control" />
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Password" autocomplete="off" class="form-control" />
            </div>
            <div class="form-group">
                <input type="number" id="partnerId" placeholder="Partner ID" autocomplete="off" class="form-control" />
            </div>
            <div class="form-group">
                <button type="submit" class="accent-button">Login</button>
            </div>
        </form>
    </div>
  </div>

  <div id="chat-page" class="hidden">
    <div class="chat-container">
        <div class="chat-header">
            <h2>Chat with <span id="partnerLabel"></span></h2>
        </div>
        <div class="connecting">Connecting...</div>
        <ul id="messageArea"></ul>
        <form id="messageForm" name="messageForm">
            <div class="form-group">
                <div class="input-group clearfix">
                    <input type="text" id="message" placeholder="Type a message..." autocomplete="off" class="form-control"/>
                    <button type="submit" class="primary">Send</button>
                </div>
            </div>
        </form>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
  <script src="/template-core/main.js"></script>

</body>
</html>
